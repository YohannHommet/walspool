name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.harness/**'
      - '.walspool/**'
      - 'LICENSE'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.harness/**'
      - '.walspool/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Test & Cross-Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Check Go format
        run: |
          diffs=$(gofmt -l -s .)
          if [ -n "$diffs" ]; then
            echo "Unformatted Go files found:"
            echo "$diffs"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

      - name: Run tests with race detector (Linux)
        run: go test -v -race ./...

      - name: Cross-compile validation (Darwin / macOS arm64)
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build ./...

      - name: Cross-compile validation (Windows amd64)
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./...
